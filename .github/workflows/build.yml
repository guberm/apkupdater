name: Android Build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Decode Keystore
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
      run: echo $KEYSTORE | base64 --decode > ./app/ci.ks

    - name: Decode Properties
      env:
        PROPERTIES: ${{ secrets.PROPERTIES }}
      run: echo $PROPERTIES | base64 --decode > local.properties

    - name: Build with Gradle
      env:
        BUILD_TAG: ${{ github.event_name == 'pull_request' && '.ci' || '' }}
        BUILD_NUMBER: ${{ github.event_name == 'pull_request' && github.run_number || '' }}
      run: ./gradlew build

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/3.x' && contains(github.event.head_commit.message, 'release: APKUpdater 3.1.2') }}"
      with:
        tag_name: 3.1.2
        name: APKUpdater 3.1.2
        files: ./app/build/outputs/apk/release/com.apkupdater-release.apk
        body: |
          Single TV-style UI release for Android devices.

          - Fixed action buttons wrapping on narrow phone and tablet screens.
          - Prevented install progress text from collapsing vertically.
          - Rendered HTML release notes without visible markup.
        prerelease: false
