name: Android TV Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Decode Keystore
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
      run: echo $KEYSTORE | base64 --decode > ./app/ci.ks

    - name: Decode Properties
      env:
        PROPERTIES: ${{ secrets.PROPERTIES }}
      run: echo $PROPERTIES | base64 --decode > local.properties

    - name: Build with Gradle
      env:
        BUILD_TAG: ${{ github.event_name == 'pull_request' && '.ci' || '' }}
        BUILD_NUMBER: ${{ github.event_name == 'pull_request' && github.run_number || '' }}
      run: ./gradlew build

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/3.x' && contains(github.event.head_commit.message, 'release: APKUpdater TV 3.1.0') }}"
      with:
        tag_name: 3.1.0
        name: APKUpdater TV 3.1.0
        files: ./app/build/outputs/apk/release/com.apkupdater-release.apk
        body: |
          Android TV-only release.

          - Removed the phone UI and all UI mode switches.
          - Fixed intermittent installer callback crashes.
          - Added Source buttons for opening provider pages.
          - Hardened downloads, cancellation, and install-session cleanup.
        prerelease: false
