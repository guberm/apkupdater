name: Android Build

on:
  push:
    branches: [main]
    tags: ['3.*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Build and test pull request
      if: github.event_name == 'pull_request'
      run: ./gradlew test lint assembleDebug

    - name: Configure release signing
      if: github.event_name == 'push'
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      run: |
        test -n "$KEYSTORE_BASE64"
        test -n "$STORE_PASSWORD"
        test -n "$KEY_ALIAS"
        test -n "$KEY_PASSWORD"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apkupdater-release.jks"

    - name: Build and test signed release
      if: github.event_name == 'push'
      env:
        APKUPDATER_KEYSTORE_FILE: ${{ runner.temp }}/apkupdater-release.jks
        APKUPDATER_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        APKUPDATER_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        APKUPDATER_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      run: |
        ./gradlew --no-daemon test lint assembleRelease
        cp ./app/build/outputs/apk/release/com.apkupdater-release.apk "$RUNNER_TEMP/com.apkupdater-release.apk"
        ./gradlew --no-daemon clean -PsensitiveLogging=true assembleRelease
        mv ./app/build/outputs/apk/release/com.apkupdater-release.apk ./app/build/outputs/apk/release/com.apkupdater-sensitive-logging-release.apk
        cp "$RUNNER_TEMP/com.apkupdater-release.apk" ./app/build/outputs/apk/release/com.apkupdater-release.apk

    - name: Verify release signature
      if: github.event_name == 'push'
      run: |
        BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
        STANDARD=./app/build/outputs/apk/release/com.apkupdater-release.apk
        DIAGNOSTIC=./app/build/outputs/apk/release/com.apkupdater-sensitive-logging-release.apk
        "$BUILD_TOOLS/apksigner" verify --print-certs "$STANDARD"
        "$BUILD_TOOLS/apksigner" verify --print-certs "$DIAGNOSTIC"
        STANDARD_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$STANDARD" | awk -F': ' '/certificate SHA-256 digest/{print $2; exit}')
        DIAGNOSTIC_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$DIAGNOSTIC" | awk -F': ' '/certificate SHA-256 digest/{print $2; exit}')
        test -n "$STANDARD_CERT"
        test "$STANDARD_CERT" = "$DIAGNOSTIC_CERT"

    - name: Remove decoded keystore
      if: always() && github.event_name == 'push'
      run: rm -f "$RUNNER_TEMP/apkupdater-release.jks"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: ${{ github.ref_name }}
        name: APKUpdater ${{ github.ref_name }}
        files: |
          ./app/build/outputs/apk/release/com.apkupdater-release.apk
          ./app/build/outputs/apk/release/com.apkupdater-sensitive-logging-release.apk
        body: |
          - Upgrade Aurora GPlayApi from 3.5.8 to 3.6.4 for current authentication validation, parsing fixes, and server error propagation.
          - Remove the legacy Kotlin Android Extensions runtime pulled by KryptoPrefs to avoid duplicate Parcelize classes.
          - Keep Google Play and Aurora retries bounded; external HTTP 429 rate limits are still respected and not retried.
          - Installer metadata does not grant Google Play account ownership, licensing, or Play Integrity entitlement.
          - The sensitive-logging APK includes full Play request URLs and auth/cookie headers for manual debugging. Do not share its logs.
          - Both APKs use the same package, version, and signing certificate.
        prerelease: false
